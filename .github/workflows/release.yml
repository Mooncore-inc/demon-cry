name: Release (CalVer)

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate and push CalVer tag
        run: |
          TODAY=$(date -u +'%Y.%m.%d')
          BASE_TAG="$TODAY.0"

          # Find highest existing patch for today
          EXISTING=$(git tag -l "$TODAY.*" | sort -V | tail -1)
          if [ -n "$EXISTING" ]; then
            LAST_PATCH=$(echo "$EXISTING" | cut -d. -f4)
            NEXT_PATCH=$((LAST_PATCH + 1))
            TAG="$TODAY.$NEXT_PATCH"
          else
            TAG="$BASE_TAG"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git tag "$TAG"
          git push origin "$TAG"
          echo "TAG_NAME=$TAG" >> $GITHUB_ENV

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry and Plugin
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry self add "poetry-dynamic-versioning[plugin]"

      - name: Install dependencies
        run: poetry install --no-root

      - name: Build package
        run: poetry build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Release ${{ env.TAG_NAME }}
          generate_release_notes: true
