repos:
  - repo: builtin
    hooks:
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-case-conflict
      - id: detect-private-key

  - repo: local
    hooks:
      - id: typos
        name: typos
        entry: uv run --no-sync typos
        language: system

      - id: ruff-check
        name: ruff check
        entry: uv run --no-sync ruff check --fix
        language: system
        types: [python]

      - id: ruff-format
        name: ruff format
        entry: uv run --no-sync ruff format
        language: system
        types: [python]

      - id: ty
        name: ty
        entry: uv run --no-sync ty check
        language: system
        types: [python]
