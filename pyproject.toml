[project]
name = "demon-cry"
requires-python = ">=3.12, <3.15"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Fazzyt" }, { name = "mooncore-inc" }]
maintainers = [{ name = "Fazzyt" }]
dynamic = ["version"]

dependencies = [
    "fastapi",
    "openai",
    "httpx",
    "uvicorn[standard]",
    "pydantic>=2.0",
    "demon-cry-base==0.6.0",
    "sqlalchemy>=2.0.52,<3.0.0",
    "alembic>=1.13,<2.0",
    "aiosqlite>=0.19,<0.21",
    "pydantic-settings>=2.15.0,<3.0.0",
]

[project.optional-dependencies]
postgres = ["asyncpg"]

[project.scripts]
demon-cry = "demon_cry.cli:main"

[dependency-groups]
dev = [
    "pre-commit>=4.6.1,<5.0.0",
    "pytest>=8.0.0,<9.0.0",
    "pytest-asyncio>=0.24.0,<1.4.0",
    "ruff>=0.16.6,<0.17.0",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["alembic"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RET"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
