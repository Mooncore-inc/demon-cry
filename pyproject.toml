[project]
name = "demon-cry"
version = "0.4.1"
authors = [
    {name = "Fazzyt"}
]
requires-python = ">=3.12, <3.15"
dependencies = [
    "fastapi",
    "openai",
    "httpx",
    "pydantic",
    "uvicorn[standard]",
    "selectolax (>=0.4.11,<0.5.0)",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"