[project]
name = "demon-cry"
authors = [
    {name = "Fazzyt"}
]
requires-python = ">=3.12, <3.15"
dependencies = [
    "fastapi",
    "openai",
    "httpx",
    "pydantic",
    "uvicorn[standard]",
    "selectolax (>=0.4.7,<0.5.0)",
    "aiodns (>=4.0.4,<5.0.0)",
    "asyncwhois (>=1.1.12,<2.0.0)",
]

[dependency-groups]
dev = [
    "pre-commit (>=4.6.1,<5.0.0)",
    "pytest (>=8.0.0,<9.0.0)",
    "pytest-asyncio (>=0.24.0,<1.0.0)"
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
